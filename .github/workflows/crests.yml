# Télécharge les logos des clubs (Wikidata / Wikimedia Commons) et les commite dans la branche.
# Lancé quand le script change, ou à la main (onglet Actions).
name: Logos des clubs

on:
  push:
    paths:
      - tools/fetch-crests.mjs
      - .github/workflows/crests.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crests:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Télécharger les logos
        timeout-minutes: 42
        run: node tools/fetch-crests.mjs
        env:
          CREST_BUDGET_MIN: '35'
      - name: Commiter les logos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/crests src/data/crest-manifest.js
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "Logos des clubs (Wikidata / Wikimedia Commons, usage personnel)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
