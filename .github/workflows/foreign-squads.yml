# Effectifs professionnels étrangers (Wikipédia + Wikidata, usage personnel).
# Lancé à la main, ou quand le script de collecte change. Écrit tools/foreign-raw.json.
name: Effectifs étrangers

on:
  push:
    paths:
      - tools/fetch-foreign.mjs
      - .github/workflows/foreign-squads.yml
  workflow_dispatch:
    inputs:
      leagues:
        description: "Championnats (ex. eng1,esp2) ; vide = tous"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: foreign-squads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  squads:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Collecter les effectifs
        timeout-minutes: 25
        env:
          LEAGUES: ${{ github.event.inputs.leagues }}
        run: node tools/fetch-foreign.mjs
      - name: Commiter les données
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/foreign-raw.json || true
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "Effectifs étrangers (Wikipédia, Wikidata — usage personnel)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
